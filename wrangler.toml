name = "noxconnect"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Public native sign-in initiation and one-time legacy exchange are bounded
# before they can call GitHub. Keep this namespace unique within the account.
[[ratelimits]]
name = "NATIVE_AUTH_RATE_LIMITER"
namespace_id = "9137006"
simple = { limit = 10, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "noxconnect"
database_id = "c94084e6-d0be-423c-8de6-249e7cf8bf25"

# Durable background-work queue. functions/api/webhook.js produces here instead
# of using context.waitUntil; the cron Worker consumes (see cron/wrangler.toml).
# PROVISION BEFORE DEPLOY: `wrangler queues create noxconnect-tasks` (+ the DLQ).
# If the binding is absent, enqueueTask records to op_failures instead of 500ing
# the webhook — but the queue must exist for background work to actually run.
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "noxconnect-tasks"

[[services]]
binding = "NOXSPOT_RESPONSE"
service = "noxspot-api"

[[services]]
binding = "NOXCUE_RESPONSE"
service = "noxcue"

# Server-only event ingestion. The corresponding NOXCUE_INGEST_KEY secret is
# scoped to NoxConnect's NoxCue source and is never exposed to the browser.
[[services]]
binding = "NOXCUE_INGEST"
service = "noxcue"

[[services]]
binding = "NOXFEED_RESPONSE"
service = "noxfeed-response"

# Spec attachments — user-uploaded documents (.md, .pdf, .docx, .html)
# attached to a Spec. Objects are keyed `spec/<org_id>/<spec_id>/<attachment_id>`
# for tenant isolation. See functions/api/specs/[id]/attachments/*.
# PROVISION BEFORE DEPLOY: `wrangler r2 bucket create noxconnect-spec-attachments`.
# Absent binding = attachment endpoints 503 with a clear message.
[[r2_buckets]]
binding = "SPEC_ATTACHMENTS"
bucket_name = "noxconnect-spec-attachments"

# NoxSpot screenshots are deleted from the same admin surface that owns sites.
[[r2_buckets]]
binding = "NOXSPOT_ASSETS"
bucket_name = "noxspot-assets"
