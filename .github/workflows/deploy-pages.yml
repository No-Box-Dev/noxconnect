name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # On workflow_run, only deploy if CI succeeded. workflow_dispatch has no
    # parent run, so the conclusion check is skipped for manual triggers.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public client ID for the NoxConnect GitHub App. Required at build
          # time for the OAuth sign-in flow — without it, getOAuthLoginUrl()
          # throws and the login button stays unusable. Stored as a repo
          # variable (public, not a secret); the name mismatch with the Vite
          # var is historical, so we map it here rather than rename in two
          # places.
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          command: d1 migrations apply noxconnect --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.0"
          # Keep the legacy Pages project name: it owns app.unticket.ai.
          command: pages deploy dist --project-name=unticket --branch=main

      # Deploy the sibling cron Worker. It imports from functions/lib/, so
      # without this step Pages and cron drift out of sync — every change
      # to shared code (sync logic, GitHub App helpers) has to land on both.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cron
          wranglerVersion: "4.129.0"
          command: deploy

      # The anonymous capture plane is isolated from authenticated Pages
      # Functions, but this repository owns and deploys it with the same CI gate.
      - name: Install NoxSpot capture Worker dependencies
        working-directory: workers/noxspot-capture
        run: npm ci

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/noxspot-capture
          wranglerVersion: "4.129.0"
          command: deploy

      - name: Verify public NoxSpot Worker ownership
        shell: bash
        run: |
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' https://api.noxspot.dev/health || true)"
            if HEALTH_JSON="$health" node --input-type=module -e '
              const health = JSON.parse(process.env.HEALTH_JSON || "{}");
              if (health.service !== "noxspot-api" || health.owner !== "noxconnect" || health.plane !== "public-capture") process.exit(1);
            '; then
              echo "Verified api.noxspot.dev is owned by NoxConnect"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api.noxspot.dev is not serving the NoxConnect capture Worker"
          exit 1
