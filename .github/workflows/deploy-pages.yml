name: Deploy NoxConnect

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-noxconnect
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install NoxSpot dependencies
        working-directory: workers/noxspot-capture
        run: npm ci
      - name: Build frontend and private gateway
        run: |
          npm run build
          npm run build:api-gateway
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}

      - name: Migrate staging
        run: npx wrangler d1 migrations apply DB --config workers/api-gateway/wrangler.jsonc --env staging --remote
      - name: Deploy staging capabilities
        run: npx wrangler deploy --config workers/connection-capabilities/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging API gateway
        run: npx wrangler deploy --config workers/api-gateway/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging orchestrator
        run: npx wrangler deploy --config cron/wrangler.toml --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging NoxSpot
        run: npx wrangler deploy --config workers/noxspot-capture/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Smoke staging release
        run: node scripts/smoke-deployment.mjs https://noxhere-staging.jasper-414.workers.dev https://noxspot-api-staging.jasper-414.workers.dev "$DEPLOY_SHA"

      - name: Migrate production
        run: npx wrangler d1 migrations apply DB --config workers/api-gateway/wrangler.jsonc --env="" --remote
      - name: Deploy production capabilities
        run: npx wrangler deploy --config workers/connection-capabilities/wrangler.jsonc --env="" --message "$DEPLOY_SHA"
      - name: Deploy production API gateway
        run: npx wrangler deploy --config workers/api-gateway/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy legacy Pages surface
        run: npx wrangler pages deploy dist --project-name=noxconnect --branch=main
      - name: Deploy production orchestrator
        run: npx wrangler deploy --config cron/wrangler.toml --env="" --message "$DEPLOY_SHA"
      - name: Deploy production NoxSpot
        run: npx wrangler deploy --config workers/noxspot-capture/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Smoke production release
        run: node scripts/smoke-deployment.mjs https://app.noxhere.com https://api.noxspot.dev "$DEPLOY_SHA"
      - name: Notify ecosystem verification
        env:
          GH_TOKEN: ${{ secrets.NOXHERE_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh api repos/No-Box-Dev/NoxHere/dispatches --method POST -f event_type=nox-service-deployed -f 'client_payload[service]=noxconnect' -f "client_payload[sha]=$DEPLOY_SHA"
          fi
